<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharingan</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <div class="eyes">
      <div class="left-eye">
        <div class="close-eyes"></div>

        <div class="pupil">
          <div class="black"></div>
        </div>
        <div class="iris-lines"></div>
        <div class="orbit-ring"></div>
        <div class="pupil-light"></div>

        <div class="spinner">
          <div class="spin-fire"><div class="tomoe"></div></div>
          <div class="spin-fire"><div class="tomoe"></div></div>
          <div class="spin-fire"><div class="tomoe"></div></div>
        </div>
      </div>

      <div class="right-eye">
        <div class="close-eyes"></div>
        <div class="right-pupil">
          <div class="black"></div>
        </div>
        <div class="iris-lines"></div>
        <div class="orbit-ring"></div>
        <div class="pupil-light-2"></div>

        <div class="spinner">
          <div class="spin-fire"><div class="tomoe"></div></div>
          <div class="spin-fire"><div class="tomoe"></div></div>
          <div class="spin-fire"><div class="tomoe"></div></div>
        </div>
      </div>
    </div>
  </body>
</html>
